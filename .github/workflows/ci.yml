name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

      - name: Build (tsup ESM + dts)
        run: pnpm build

      - name: Package sanity (files manifest)
        run: npm pack --dry-run

      - name: Upload build artifacts
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: lib/
          retention-days: 7
