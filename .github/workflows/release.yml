name: Release

# Phase 5: publishing this plugin is a single git push.
#
#   pnpm run release:check                                  # publish preflight
#   git tag -a vX.Y.Z -m "release X.Y.Z" && git push origin vX.Y.Z
#
# Pushing a vX.Y.Z tag re-runs the full CI gate, adds the publish preflight
# (npm pack + install the tarball into a throwaway consumer project + registry
# duplicate-version check), and publishes the packed tarball.
#
# Authentication uses npm's OIDC trusted publishing / provenance (id-token:
# write below), so no long-lived token has to live in repository secrets - npm
# just needs a publisher configured for this repo (a pending publisher while
# the package name does not exist yet). Add an NPM_TOKEN repository secret
# instead and the publish step authenticates with that token.
#
# Rehearse without publishing: Actions -> Release -> Run workflow, dry_run on.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to run against (e.g. v1.2.0)'
        required: true
        default: 'main'
      dry_run:
        description: 'Run the whole pipeline but stop before npm publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    name: Gate (verify + build + publish preflight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Tag must name the packaged version
        if: github.event_name == 'push'
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          fi
          echo "publishing dsh-plugin-subagents-orchestrator@$version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

      - name: Build (tsup ESM + dts)
        run: pnpm build

      # lib/ is committed so a git-hosted install (dsh plugin add github:...)
      # ships a build; a stale lib/ would publish code that does not match src/.
      # *.map files are excluded: they embed sourcesContent verbatim, so an
      # editor-introduced CR makes the byte-compare platform-dependent. The
      # shipped payload (lib/*.js, lib/*.d.ts) is what must match.
      - name: Committed lib/ matches the build
        run: |
          if git diff --quiet -- lib ':(exclude)lib/*.map'; then
            echo "lib/ payload is current"
          else
            echo "::error::lib/ is stale - rebuild and commit it before tagging"
            git --no-pager diff --stat -- lib ':(exclude)lib/*.map'
            exit 1
          fi

      - name: Publish preflight (pack, install smoke, registry)
        run: pnpm run release:check -- --require-clean

      - name: Pack the artifact to publish
        run: |
          set -e
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    # GitHub Release notes need contents: write; the npm auth itself only
    # ever reads the registry, so keep the elevated permission in this job.
    permissions:
      contents: write
      id-token: write
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      # Needed for the changelog-driven release notes below (the tarball
      # itself comes from the gate job's artifact).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Nothing in this workflow runs on a pull request, so the upload/download
      # pair below is exercised on every push by ci.yml instead
      # (pack-release-artifact -> unpack-release-artifact), including a checksum
      # and a look inside the returned tarball.
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: dist

      # Deliberately no registry-url here: setup-node writes an
      # //registry.npmjs.org/:_authToken entry into the userconfig even when
      # NODE_AUTH_TOKEN is unset (a placeholder value), and that entry
      # outranks the OIDC identity - so the token-free route would 401 on a
      # step that looks configured. The public registry is npm's default
      # anyway; auth is written explicitly below when a token exists.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          echo "registry: $(npm config get registry)"
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
            echo "npm: publishing with the NPM_TOKEN secret"
          else
            echo "npm: no NPM_TOKEN secret - publishing through OIDC trusted publishing"
            echo "npm:   (requires a publisher configured for this repo in the npm UI)"
          fi

      - name: Publish
        run: |
          set -e
          tarball=$(ls dist/*.tgz)
          echo "publishing $tarball"
          npm publish "$tarball" --provenance --access public

      - name: Confirm the registry serves it
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          npm view "dsh-plugin-subagents-orchestrator@$version" version dist.tarball

      # Release notes come from CHANGELOG.md through the same preflight that
      # gated the artifact - never from a hand-copied summary.
      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          node scripts/release-check.mjs --print-changelog "$version" > release-notes.md
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" --title "v$version" --notes-file release-notes.md
          else
            gh release create "v$version" --title "v$version" --notes-file release-notes.md --verify-tag
          fi
