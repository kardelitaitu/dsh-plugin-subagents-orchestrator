name: Feature request
description: Propose a capability for the orchestrator
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that the plugin cannot do today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: |
        New config keys, their defaults, and how they interact with mode/strategy,
        the circuit breaker and the failover chain. One invariant to design within:
        a subagent start is never rejected, queued or stalled by this plugin -
        overflow passes through unrouted.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
